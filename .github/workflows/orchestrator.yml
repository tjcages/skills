name: Orchestrator skill

on:
  pull_request:
    paths:
      - ".github/workflows/orchestrator.yml"
      - "orchestrator/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/orchestrator.yml"
      - "orchestrator/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node orchestrator/scripts/verify.mjs
